<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PostField</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><main>
  <div class="brand"><img src="icons/32.png" width="28" height="28" alt=""><span>PostField</span><span id="source" class="source-badge">Photon</span></div>
  <h1>Почтовый индекс</h1><p id="origin" class="hint">Текущий сайт</p>
  <p id="setup" class="notice" hidden>Проверьте ключи выбранного источника и передачу адреса в настройках.</p>
  <button id="fill" type="button">Заполнить сейчас</button>
  <div class="mode-cards">
    <fieldset class="mode-card"><legend>Все сайты</legend><div class="segmented">
      <input id="global-auto" type="radio" name="global-mode" value="auto"><label for="global-auto">Авто</label>
      <input id="global-manual" type="radio" name="global-mode" value="manual"><label for="global-manual">Вручную</label>
    </div></fieldset>
    <fieldset class="mode-card"><legend>Этот сайт</legend><div class="segmented">
      <input id="site-auto" type="radio" name="site-mode" value="auto"><label for="site-auto">Авто</label>
      <input id="site-manual" type="radio" name="site-mode" value="manual"><label for="site-manual">Вручную</label>
    </div></fieldset>
  </div>
  <p id="mode-hint" class="hint"></p>
  <button id="map" type="button" class="secondary">Назначить поля вручную</button>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="options" type="button" class="link">Источник, настройки и приватность</button>
  <p class="hint">Авто — только при точном совпадении дома. Ваш индекс сохраняется. Покрытие: Россия.</p>
</main><script src="popup.js"></script></body></html>
