<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PostField</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><main>
  <div class="brand"><img src="icons/32.png" width="28" height="28" alt=""><span>PostField</span></div>
  <h1>Почтовый индекс</h1><p id="origin" class="hint">Текущий сайт</p>
  <p id="setup" class="notice" hidden>Для поиска добавьте ключ Geoapify и разрешите передачу адреса в настройках.</p>
  <button id="fill" type="button">Заполнить сейчас</button>
  <label for="mode">Режим для этого сайта</label><select id="mode"><option value="auto">Авто</option><option value="manual">Вручную</option></select>
  <button id="map" type="button" class="secondary">Назначить поля вручную</button>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="options" type="button" class="link">Настройки и приватность</button>
  <p class="hint">При единственном точном совпадении дома индекс вставляется автоматически. Точность индекса Geoapify не гарантируется.</p>
</main><script src="popup.js"></script></body></html>
